<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spoke — Messaging, connected.</title>
<link rel="icon" href="assets/spoke-mark.png">
<link rel="stylesheet" href="css/style.css">
<script>
(function(){
  try{
    var t = localStorage.getItem('spoke-theme') || 'dark';
    var resolved = t === 'system'
      ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      : t;
    document.documentElement.setAttribute('data-theme', resolved);
  }catch(e){}
})();
</script>
</head>
<body>

  <div id="boot-splash">
    <img class="boot-mark" src="assets/vynix-logo.png" alt="Vynix">
    <div class="boot-caption">A Vynix Production</div>
  </div>

  <div class="brand-row">
    <img src="assets/spoke-mark.png" alt="Spoke">
    <span>Spoke</span>
  </div>

  <main class="auth-shell">
    <div class="spoke-field">
      <svg viewBox="0 0 200 200"><g stroke="#5c98ff" stroke-width="1.4" fill="none">
        <circle cx="100" cy="100" r="98"/>
        <line x1="100" y1="2" x2="100" y2="198"/>
        <line x1="2" y1="100" x2="198" y2="100"/>
        <line x1="29" y1="29" x2="171" y2="171"/>
        <line x1="171" y1="29" x2="29" y2="171"/>
        <circle cx="100" cy="100" r="14"/>
      </g></svg>
    </div>

    <div class="auth-card">
      <img class="mark" src="assets/spoke-mark.png" alt="">
      <h1>Welcome to Spoke</h1>
      <p class="sub">Every conversation, connected.</p>

      <div class="auth-tabs">
        <button id="tab-login" class="active" type="button">Log in</button>
        <button id="tab-signup" type="button">Sign up</button>
      </div>

      <div id="panel-login" class="auth-panel active">
        <button type="button" class="google-btn" data-label='<svg viewBox="0 0 48 48" width="18" height="18"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.9-2.26 5.36-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Continue with Google'>
          <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.9-2.26 5.36-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continue with Google
        </button>
        <div class="auth-divider"><span>or continue with email</span></div>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" type="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <div class="field-error" id="login-error"></div>
          <button class="btn btn-primary btn-block" type="submit" data-label="Log in">Log in</button>
        </form>
        <div class="auth-foot-link">New here? <a href="#" onclick="document.getElementById('tab-signup').click();return false;">Create an account</a></div>
      </div>

      <div id="panel-signup" class="auth-panel">
        <button type="button" class="google-btn" data-label='<svg viewBox="0 0 48 48" width="18" height="18"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.9-2.26 5.36-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Continue with Google'>
          <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.9-2.26 5.36-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continue with Google
        </button>
        <div class="auth-divider"><span>or continue with email</span></div>
        <form id="signup-form" novalidate>
          <div class="field">
            <label for="signup-name">Display name</label>
            <input id="signup-name" type="text" placeholder="Leo" required autocomplete="name">
          </div>
          <div class="field">
            <label for="signup-username">Username</label>
            <input id="signup-username" type="text" placeholder="leo_mh" required autocomplete="off">
          </div>
          <div class="field">
            <label for="signup-email">Email</label>
            <input id="signup-email" type="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="field">
            <label for="signup-password">Password</label>
            <input id="signup-password" type="password" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6">
          </div>
          <div class="field-error" id="signup-error"></div>
          <button class="btn btn-primary btn-block" type="submit" data-label="Create account">Create account</button>
        </form>
        <div class="auth-foot-link">Already have one? <a href="#" onclick="document.getElementById('tab-login').click();return false;">Log in</a></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <img src="assets/vynix-mark.png" alt="">
    <span>Built by <span class="vx">Vynix</span></span>
  </footer>

  <script src="js/intro.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
